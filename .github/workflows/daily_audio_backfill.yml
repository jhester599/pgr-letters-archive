name: Daily Audio Backfill

# Runs every day to generate up to 3 NotebookLM podcast audio overviews,
# compress them, and publish to GitHub Pages.
#
# ── QUOTA ────────────────────────────────────────────────────────────────────
# NotebookLM free tier allows ~3 audio overviews per day per account.
# At 3/day the 99-letter backlog clears in ~33 days. Once it's clear,
# the daily "check" job exits in seconds with nothing to do — no need
# to disable this workflow. New letters scraped by quarterly_podcast.yml
# will automatically be picked up the following day.
#
# ── SECRETS REQUIRED ─────────────────────────────────────────────────────────
# NOTEBOOKLM_AUTH_JSON  — Contents of storage_state.json from `notebooklm login`.
#   Capture:  notebooklm login
#             cat ~/.notebooklm/profiles/default/storage_state.json
#   Store as: repo Settings → Secrets and variables → Actions → New repository secret
#             Name: NOTEBOOKLM_AUTH_JSON
#
#   Session cookies expire every few weeks. When generator.py logs an auth
#   error, re-run `notebooklm login` locally and update the secret.
#
# ── SCHEDULE ─────────────────────────────────────────────────────────────────
# 10:00 UTC daily. NotebookLM's daily quota resets around midnight Pacific
# (08:00 UTC), so 10:00 UTC gives a comfortable 2-hour buffer after reset.

on:
  # schedule:
  #   - cron: "0 10 * * *"    # Daily at 10:00 UTC (disabled)
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max NotebookLM overviews to generate (default: 3; free tier limit is ~3/day)"
        default: "3"
        type: string
      skip_notebooklm:
        description: "Skip NotebookLM generation — compress and publish existing audio only"
        type: boolean
        default: false

jobs:

  # ── Job 1: Fast pre-check ──────────────────────────────────────────────────
  # Counts pending letters using only stdlib python3 (no pip install required).
  # On scheduled runs where everything is already done, only this cheap job
  # executes — no Playwright install, no Python setup, no wasted minutes.
  check:
    name: Count pending letters
    runs-on: ubuntu-24.04
    outputs:
      pending_count: ${{ steps.count.outputs.pending_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Count letters pending NotebookLM audio
        id: count
        run: |
          COUNT=$(python3 -c "
          import json
          with open('docs/ledger.json') as f:
              ledger = json.load(f)
          pending = [
              f for f in ledger['filings']
              if f.get('letter_scraped') and not f.get('audio_generated')
              and f.get('letter_file') and not f.get('skip_reason')
          ]
          print(len(pending))
          ")
          echo "pending_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "Backlog is clear — nothing to generate today."
          else
            echo "$COUNT letter(s) pending NotebookLM audio generation."
          fi

  # ── Job 2: Full pipeline ───────────────────────────────────────────────────
  # Skipped entirely on scheduled runs when there is nothing pending,
  # saving ~8 minutes of setup time per idle day.
  backfill:
    name: Generate → Compress → Publish
    needs: check
    if: needs.check.outputs.pending_count != '0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120    # NotebookLM generation can take ~30 min per letter × 3

    permissions:
      contents: write   # Required to push ledger/feed/page updates back to main

    steps:
      # ── Setup ───────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        # ffmpeg + ffprobe are needed for audio compression. The johnvansickle.com
        # static build is the preferred source (apt previously failed when libcaca0
        # was yanked from noble-updates), but that single mirror occasionally
        # returns HTTP errors (wget exit 8), which fails the whole job. Retry the
        # download a few times, then fall back to apt so a flaky mirror can't
        # block the run.
        run: |
          set -uo pipefail

          install_via_static() {
            for attempt in 1 2 3; do
              if wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
                   -O /tmp/ffmpeg-static.tar.xz; then
                return 0
              fi
              echo "ffmpeg static download attempt ${attempt} failed; retrying in $((attempt * 5))s…"
              sleep $((attempt * 5))
            done
            return 1
          }

          if install_via_static; then
            mkdir -p /tmp/ffmpeg-static
            tar -xf /tmp/ffmpeg-static.tar.xz -C /tmp/ffmpeg-static --strip-components=1
            sudo install -m 755 /tmp/ffmpeg-static/ffmpeg  /usr/local/bin/
            sudo install -m 755 /tmp/ffmpeg-static/ffprobe /usr/local/bin/
          else
            echo "Static build unavailable after retries — falling back to apt."
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          ffmpeg -version

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        run: playwright install chromium --with-deps

      # ── Git identity ─────────────────────────────────────────────────────
      # Configured once, up front, so every per-letter commit in the loop
      # below can push the moment a letter finishes.
      - name: Configure git for pushing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install

          # Embed token directly in remote URL so the push survives
          # credential-helper resets caused by git lfs install or token
          # renewal failures during long-running jobs.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      # ── Generate → Compress → Publish, ONE LETTER AT A TIME ──────────────
      # Each letter is generated, compressed, and pushed to main individually.
      # This makes the pipeline crash-safe: if the job is cancelled (e.g. the
      # 120-minute timeout), every letter completed *before* the cancellation
      # is already committed and pushed. Only the in-flight letter is lost,
      # and re-running picks it up because its ledger flag was never set.
      #
      # generator.py is invoked with --max-new 1 per iteration so its own
      # ledger update + our compress/commit happen as a single durable unit.
      - name: Generate, compress, and publish (per-letter commits)
        if: ${{ inputs.skip_notebooklm != true }}
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          PAGES_BASE_URL: "https://jhester599.github.io/pgr-letters-archive"
        run: |
          set -uo pipefail

          MAX_NEW="${{ inputs.max_new || '3' }}"

          # Count letters scraped but not yet converted to audio (matches the
          # pending_letters() filter in generator.py).
          pending_count() {
            python3 -c "
          import json
          with open('docs/ledger.json') as f:
              led = json.load(f)
          pend = [x for x in led['filings']
                  if x.get('letter_scraped') and not x.get('audio_generated')
                  and x.get('letter_file') and not x.get('skip_reason')]
          print(len(pend))
          "
          }

          for i in $(seq 1 "${MAX_NEW}"); do
            BEFORE=$(pending_count)
            if [ "${BEFORE}" -eq 0 ]; then
              echo "Backlog clear — nothing left to generate."
              break
            fi

            echo "──── Letter ${i}/${MAX_NEW} (pending before: ${BEFORE}) ────"

            # Generate exactly one letter. A non-zero exit (auth failure, etc.)
            # stops the loop without failing the job, preserving everything
            # already pushed in earlier iterations.
            if ! python scripts/generator.py --max-new 1; then
              echo "Generator exited non-zero — stopping. Earlier letters are already pushed."
              break
            fi

            # If the pending count did not drop, generation produced nothing
            # (quota exhausted or a soft failure) — stop rather than spin.
            AFTER=$(pending_count)
            if [ "${AFTER}" -ge "${BEFORE}" ]; then
              echo "No new audio this round (likely quota exhausted) — stopping."
              break
            fi

            # Compress the freshly generated raw audio, refresh the feed,
            # reading pages, and progress tracker.
            python scripts/audio_progress.py
            python scripts/compressor.py
            python scripts/build_pages.py

            # Commit + push immediately so a later timeout cannot discard this.
            git add \
              docs/ledger.json \
              docs/feed.xml \
              docs/letters/ \
              AUDIO_PROGRESS.md

            if git diff --staged --quiet; then
              echo "Nothing staged after letter ${i} — skipping commit."
            else
              git commit -m "chore: daily audio backfill $(date -u '+%Y-%m-%d') (letter ${i})"
              # Rebase onto any concurrent pushes (e.g. quarterly_podcast.yml)
              # before pushing to avoid non-fast-forward rejections.
              git pull --rebase origin main || true
              git push origin main
              echo "Pushed letter ${i}."
            fi
          done

      # ── Skip-NotebookLM mode: compress + publish existing audio only ─────
      # Used when the workflow is dispatched with skip_notebooklm=true to
      # re-compress / re-publish without consuming any NotebookLM quota.
      - name: Compress and publish existing audio
        if: ${{ inputs.skip_notebooklm == true }}
        env:
          PAGES_BASE_URL: "https://jhester599.github.io/pgr-letters-archive"
        run: |
          set -uo pipefail

          python scripts/audio_progress.py
          python scripts/compressor.py
          python scripts/build_pages.py

          git add \
            docs/ledger.json \
            docs/feed.xml \
            docs/letters/ \
            AUDIO_PROGRESS.md

          if git diff --staged --quiet; then
            echo "No new files to commit — nothing changed."
          else
            git commit -m "chore: compress + publish existing audio [$(date -u '+%Y-%m-%d')]"
            git pull --rebase origin main || true
            git push origin main
            echo "Changes pushed to main."
          fi
