name: Quarterly Podcast Pipeline

# PRIMARY TRIGGER — repository_dispatch fired by the Gmail Apps Script
# (scripts/gmail_trigger.js) when Progressive's investor alert service
# sends a 10-Q or 10-K filing notification email.
#
# FALLBACK TRIGGER — weekly Friday cron catches any filing alert that
# the email trigger missed (network hiccup, script gap, sender change, etc.).
# Filing windows for reference:
#   • Q1 (Jan–Mar): filed mid-April to mid-May
#   • Q2 (Apr–Jun): filed mid-July to mid-August
#   • Q3 (Jul–Sep): filed mid-October to mid-November
#   • Q4 / Annual (10-K): filed mid-February to early-March
#
# Manual triggering is also available for testing or backfills.
on:
  repository_dispatch:
    types: [sec-filing-alert]   # Fired by gmail_trigger.js via GitHub API
  # schedule:
  #   - cron: "0 12 * * 5"      # Fallback: every Friday at 12:00 UTC (disabled)
  workflow_dispatch:             # Manual runs from the Actions tab
    inputs:
      skip_audio:
        description: "Skip NotebookLM audio generation (text + summary only)"
        type: boolean
        default: false

jobs:
  run-pipeline:
    name: Scrape → Generate → Compress → Publish
    runs-on: ubuntu-24.04   # Pinned to avoid unexpected breakage when ubuntu-latest advances
    timeout-minutes: 120    # NotebookLM generation can take ~35 min; cap runaway jobs at 2 h

    permissions:
      contents: write      # Required to push new files back to main
      models: read         # Required for GitHub Models API (summarizer.py)
      # pages: write and id-token: write are only needed for the Actions Pages API
      # deployment flow (currently commented out). Pages deploys via push to main.

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use a PAT (PIPELINE_TOKEN) if you need to push and trigger a
          # subsequent Pages deployment; the default GITHUB_TOKEN works fine
          # for push+Pages in most setups.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. System dependencies ────────────────────────────────────────────
      # ffmpeg/ffprobe are the only system dependency the pipeline needs, and
      # they come from the johnvansickle.com static build rather than apt: apt's
      # ffmpeg pulls in the multimedia stack, which broke when libcaca0 was
      # yanked from noble-updates. That single mirror occasionally returns HTTP
      # errors, so retry a few times before falling back to apt. Mirrors the
      # proven install step in daily_audio_backfill.yml.
      #
      # espeak-ng used to be installed here for Kokoro TTS; it went away with
      # the TTS step. Re-add it if you re-enable TTS — see TTS.md.
      - name: Install system dependencies
        run: |
          set -uo pipefail

          install_ffmpeg_static() {
            for attempt in 1 2 3; do
              if wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
                   -O /tmp/ffmpeg-static.tar.xz; then
                return 0
              fi
              echo "ffmpeg static download attempt ${attempt} failed; retrying in $((attempt * 5))s…"
              sleep $((attempt * 5))
            done
            return 1
          }

          if install_ffmpeg_static; then
            mkdir -p /tmp/ffmpeg-static
            tar -xf /tmp/ffmpeg-static.tar.xz -C /tmp/ffmpeg-static --strip-components=1
            sudo install -m 755 /tmp/ffmpeg-static/ffmpeg  /usr/local/bin/
            sudo install -m 755 /tmp/ffmpeg-static/ffprobe /usr/local/bin/
          else
            echo "Static build unavailable after retries — falling back to apt."
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          ffmpeg -version

      # ── 4. Python dependencies ────────────────────────────────────────────
      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        run: playwright install chromium --with-deps

      # ── 5. Run pipeline scripts ───────────────────────────────────────────
      - name: Scrape SEC EDGAR for new filings
        run: python scripts/scraper.py

      - name: Generate letter summaries
        env:
          # GITHUB_TOKEN is provided automatically — no secret setup required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/summarizer.py

      # ── Audio generation is best-effort ───────────────────────────────────
      # NotebookLM auth is a browser session cookie that expires every few weeks
      # and cannot be renewed unattended. Before, an expired cookie aborted the
      # whole job at this step, so scraping, summaries, reading pages, the RSS
      # feed, and the commit never ran — a new filing would silently not appear
      # on the site. Audio now fails soft: the text pipeline always completes,
      # and the run summary explains how to produce the missing audio by hand.
      - name: Generate audio overviews via NotebookLM
        id: notebooklm
        if: ${{ inputs.skip_audio != true }}
        continue-on-error: true
        env:
          # NOTEBOOKLM_AUTH_JSON: capture locally with:
          #   notebooklm login
          #   cat ~/.notebooklm/profiles/default/storage_state.json
          # Store the full JSON as the NOTEBOOKLM_AUTH_JSON repository secret.
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: python scripts/generator.py --max-new 1

      # NOTE: Kokoro TTS read-through generation used to run here. It is paused,
      # not deleted — scripts/tts.py, the ledger's tts_* fields, the reading-page
      # player, and the published tts_ release assets all still work. TTS.md has
      # the rationale and the exact step to paste back to re-enable it.

      - name: Report skipped audio in the run summary
        if: ${{ steps.notebooklm.outcome == 'failure' }}
        run: |
          {
            echo "### ⚠️ NotebookLM audio generation did not complete"
            echo
            echo "The text pipeline still ran — letters, summaries, reading pages,"
            echo "and the RSS feed are up to date. Only the audio overview is missing."
            echo
            echo "The \`NOTEBOOKLM_AUTH_JSON\` session has most likely expired."
            echo "Regenerate it locally:"
            echo
            echo '```'
            echo "notebooklm login"
            echo "python scripts/generator.py --max-new 1"
            echo "python scripts/compressor.py"
            echo '```'
            echo
            echo "Then update the \`NOTEBOOKLM_AUTH_JSON\` repository secret."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compress audio and regenerate RSS feed
        env:
          PAGES_BASE_URL: "https://jhester599.github.io/pgr-letters-archive"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/compressor.py

      - name: Build reading pages
        run: python scripts/build_pages.py

      # ── 6. Commit and push any new / updated files ────────────────────────
      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/letters/ \
            data/summaries/ \
            docs/ledger.json \
            docs/feed.xml \
            docs/letters/ \
            docs/letters_txt/

          if git diff --staged --quiet; then
            echo "No new files to commit — pipeline found nothing new."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d')
            git commit -m "chore: auto-update quarterly podcast archive [${TIMESTAMP}]"
            git pull --rebase origin main
            git push origin main
            echo "Changes pushed to main."
          fi

      # ── 7. Deploy to GitHub Pages ─────────────────────────────────────────
      # GitHub Pages is configured to serve from the /docs folder on main,
      # so pushing to main (step 6) is sufficient to trigger a Pages build.
      # The steps below are an alternative if you prefer the Pages API flow.
      #
      # - name: Upload Pages artifact
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: docs/
      #
      # - name: Deploy to GitHub Pages
      #   uses: actions/deploy-pages@v4
