name: Letter Readings (Gemini TTS)

# Works through the backlog of letter read-throughs: narrates up to
# max_letters letters that have a narrator voice and no reading yet (newest
# first), uploads each MP3 to the audio-library release, rewrites
# docs/feed_readings.xml, rebuilds the affected reading pages and commits.
#
# Runs daily until the backlog is done, then each run finds nothing to narrate
# and commits nothing. New letters are also narrated by the main pipeline
# (quarterly_podcast.yml), so after the backlog this mostly idles.
#
# Free tier: a quarterly letter is ~8 requests, an annual one ~15-20; the
# default of 6 letters stays well inside the daily request limits seen so far.
# If the daily quota runs out mid-run, readings.py stops early and keeps what
# it finished.

on:
  schedule:
    - cron: "17 9 * * *"     # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      max_letters:
        description: "Most letters to narrate this run (0 = rewrite the feed only)"
        default: "6"
        type: string

concurrency:
  group: archive-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # Same ffmpeg install as quarterly_podcast.yml: the static build first,
      # apt only as a fallback (apt's ffmpeg has broken on libcaca0 before).
      - name: Install ffmpeg
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
                 -O /tmp/ffmpeg-static.tar.xz; then
              mkdir -p /tmp/ffmpeg-static
              tar -xf /tmp/ffmpeg-static.tar.xz -C /tmp/ffmpeg-static --strip-components=1
              sudo install -m 755 /tmp/ffmpeg-static/ffmpeg /usr/local/bin/
              break
            fi
            sleep $((attempt * 5))
          done
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          ffmpeg -version | head -1

      - name: Install Python packages
        run: pip install -r requirements.txt

      # The input reaches the script through an env var, never interpolated
      # into the shell command. Scheduled runs have no inputs: default to 6.
      - name: Narrate pending letters
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_BASE_URL: "https://jhester599.github.io/pgr-letters-archive"
          MAX_LETTERS: ${{ inputs.max_letters || '6' }}
        run: |
          case "$MAX_LETTERS" in ''|*[!0-9]*) echo "max_letters must be a number"; exit 1;; esac
          python scripts/readings.py --publish --max-letters "$MAX_LETTERS"

      - name: Build reading pages
        run: python scripts/build_pages.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ledger.json docs/feed_readings.xml docs/letters/
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: add letter readings [$(date -u '+%Y-%m-%d')]"
            git pull --rebase origin main
            git push origin main
          fi
